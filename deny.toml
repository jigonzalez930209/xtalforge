# cargo-deny configuration (Task 0.1.3).
#
# Check locally with:
#   cargo deny check
#
# The default graph models a normal build: it must stay pure Rust (AGENTS.md
# rule 3). C-backed dependencies may only appear behind an optional feature and
# require a documented decision before they are added; a release audit also
# runs `cargo deny --all-features check`.

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is a transitive dependency of arrow/parquet 60 behind the optional ml-parquet feature; the advisory is an unmaintained notice, not a vulnerability, and no replacement exists in this release line" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
# One version per crate keeps the dependency tree small and auditable. Add a
# `skip` entry with a reason only when two versions are genuinely required.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  { crate = "cc", wrappers = ["minicov", "ring", "tract-linalg", "iana-time-zone-haiku"], reason = "ring builds its constant-time primitives for the optional net feature; minicov is a wasm-bindgen-test build dependency; tract-linalg and iana-time-zone probe their host at build time" },
  { crate = "cmake", reason = "native builds must stay behind optional features (AGENTS.md rule 3)" },
]
skip = [
  { crate = "syn", reason = "proc-macro build-time duplicate: moyo needs syn 2, clap/pyo3/serde need syn 3" },
  { crate = "getrandom", reason = "ring pins getrandom 0.2; the rest of the graph already uses 0.4" },
  { crate = "windows-sys", reason = "ring pins windows-sys 0.52; the rest of the graph uses 0.61" },
  { crate = "base64", reason = "tract and the existing net stack use different base64 majors; both are pure Rust and behind optional features" },
  { crate = "cpufeatures", reason = "arrow/parquet and the existing crypto stack use different cpufeatures majors" },
  { crate = "hashbrown", reason = "tract and the existing workspace use different hashbrown majors" },
  { crate = "num-bigint", reason = "arrow and the existing numeric stack use different num-bigint majors" },
  { crate = "r-efi", reason = "tract and the existing net stack use different r-efi majors" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
