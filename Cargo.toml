[workspace]
resolver = "3"
members = [
  "crates/xtalforge",
  "crates/xtalforge-analysis",
  "crates/xtalforge-build",
  "crates/xtalforge-cli",
  "crates/xtalforge-commands",
  "crates/xtalforge-core",
  "crates/xtalforge-ff",
  "crates/xtalforge-io",
  "crates/xtalforge-modules",
  "crates/xtalforge-python",
  "crates/xtalforge-symmetry",
  "crates/xtalforge-view",
  "crates/xtalforge-testkit",
  "crates/xtalforge-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jigonzalez930209/xtalforge"
homepage = "https://jigonzalez930209.github.io/xtalforge/"
documentation = "https://docs.rs/xtalforge"
authors = ["Jose Ivan Gonzalez <jigonzalez930209@gmail.com>"]
keywords = ["crystal", "chemistry", "symmetry", "materials", "science"]
categories = ["science", "science::chemistry", "simulation"]

[workspace.dependencies]
# Internal crates. `scripts/sync-version.sh` rewrites the pinned versions.
xtalforge = { version = "=0.0.0", path = "crates/xtalforge" }
xtalforge-core = { version = "=0.0.0", path = "crates/xtalforge-core" }
xtalforge-ff = { version = "=0.0.0", path = "crates/xtalforge-ff" }
xtalforge-io = { version = "=0.0.0", path = "crates/xtalforge-io" }
xtalforge-modules = { version = "=0.0.0", path = "crates/xtalforge-modules" }
xtalforge-analysis = { version = "=0.0.0", path = "crates/xtalforge-analysis" }
xtalforge-build = { version = "=0.0.0", path = "crates/xtalforge-build" }
xtalforge-commands = { version = "=0.0.0", path = "crates/xtalforge-commands" }
xtalforge-symmetry = { version = "=0.0.0", path = "crates/xtalforge-symmetry" }
xtalforge-view = { version = "=0.0.0", path = "crates/xtalforge-view" }

# External crates shared by more than one crate.
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
rayon = "1"
moyo = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"

[workspace.lints.rust]
# `deny` rather than `forbid`: binding crates relax it locally for the pyo3
# macros, with a comment that explains why.
unsafe_code = "deny"
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
