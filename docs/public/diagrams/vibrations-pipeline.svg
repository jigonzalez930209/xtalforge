<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" role="img" aria-label="Hessian to vibrational modes"><title>Hessian to vibrational modes</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="649" height="219" rx="10"/><text class="t" x="18" y="26">Hessian to vibrational modes</text><rect class="f1 ln" x="20" y="80" width="112" height="56" rx="8"/><text class="s" x="76" y="106" text-anchor="middle">Displace ±step</text><text class="s" x="76" y="124" text-anchor="middle">(6N + 1 forces)</text><line class="bl" x1="132" y1="108" x2="144" y2="108" /><rect class="f1 ln" x="144" y="80" width="112" height="56" rx="8"/><text class="s" x="200" y="112" text-anchor="middle">H = (H + Hᵀ)/2</text><line class="bl" x1="256" y1="108" x2="268" y2="108" /><rect class="f1 ln" x="268" y="80" width="112" height="56" rx="8"/><text class="s" x="324" y="106" text-anchor="middle">Mass-weight,</text><text class="s" x="324" y="124" text-anchor="middle">project translations</text><line class="bl" x1="380" y1="108" x2="392" y2="108" /><rect class="f1 ln" x="392" y="80" width="112" height="56" rx="8"/><text class="s" x="448" y="106" text-anchor="middle">Jacobi</text><text class="s" x="448" y="124" text-anchor="middle">eigensolver</text><line class="bl" x1="504" y1="108" x2="516" y2="108" /><rect class="f1 ln" x="516" y="80" wi