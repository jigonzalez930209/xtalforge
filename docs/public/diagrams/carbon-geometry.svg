<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-label="Graphene cell and nanotube roll"><title>Graphene cell and nanotube roll</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="879" height="279" rx="10"/><text class="t" x="18" y="26">Graphene cell and nanotube roll</text><circle class="A" cx="60.0" cy="215.0" r="5" /><circle class="B" cx="84.0" cy="201.1" r="5" /><circle class="A" cx="108.0" cy="215.0" r="5" /><circle class="B" cx="132.0" cy="201.1" r="5" /><circle class="A" cx="156.0" cy="215.0" r="5" /><circle class="B" cx="180.0" cy="201.1" r="5" /><circle class="A" cx="84.0" cy="173.4" r="5" /><circle class="B" cx="108.0" cy="159.6" r="5" /><circle class="A" cx="132.0" cy="173.4" r="5" /><circle class="B" cx="156.0" cy="159.6" r="5" /><circle class="A" cx="180.0" cy="173.4" r="5" /><circle class="B" cx="204.0" cy="159.6" r="5" /><circle class="A" cx="108.0" cy="131.9" r="5" /><circle class="B" cx="132.0" cy="118.0" r="5" /><circle class="A" cx="156.0" cy="131.9" r="5" /><circle class="B" cx="180.0" cy="118.0" r="5" /><circle class="A" cx="204.0" cy="131.9" r="5" /><circle class="B" cx="228.0" cy="118.0" r="5" /><polygon class="bl" fill="none" points="60,215 204,215 276,90 132,90"/><text class="s" x="60" y="238" text-anchor="start">graphene nx×ny: a₁=(a,0), a₂=(a/2, a√3/2), a = 1.42√3</text><text class="s" x="60" y="256" text-anchor="start">atoms at ((i+u)/nx, (j+v)/ny), (u,v) = (0,0), (⅓,⅓)</text><ellipse class="gr" cx="470" cy="150" rx="50" ry="16" fill="none"/><line class="ln" x1="420" y1="150" x2="420" y2="215"/><line class="ln" x1="520" y1="150" x2="520" y2="215"/><ellipse class="gr" cx="470" cy="215" rx="50" ry="16" fill="none"/><circle class="R" r="6"><animateMotion dur="5s" repeatCount="indefinite" path="M 420 150 A 50 16 0 1 0 520 150 A 50 16 0 1 0 420 150"/></circle><text class="s" x="470" y="248" text-anchor="middle">nanotube (n,m)</text><text class="m" x="560" y="100" text-anchor="start">C = n a₁ + m a₂,  R = |C| / 2π</text><text class="m" x="560" y="126" text-anchor="start">T = ((2m+n)a₁ − (2n+m)a₂) / d_R</text><text class="m" x="560" y="152" text-anchor="start">d_R = gcd(2n+m, 2m+n)</text><text class="s" x="560" y="184" text-anchor="start">atoms = 4(n²+nm+m²)/d_R per T</text><text class="s" x="560" y="206" text-anchor="start">(x, y, z) = (R sin t, along T, R cos t)</text></svg>