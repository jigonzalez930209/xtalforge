<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img" aria-label="Limits: estimate, warn, refuse"><title>Limits: estimate, warn, refuse</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="659" height="259" rx="10"/><text class="t" x="18" y="26">Limits: estimate, warn, refuse</text><line class="ln" x1="40" y1="150" x2="620" y2="150"/><circle class="C" cx="40" cy="150" r="7" /><text class="s" x="40" y="176" text-anchor="middle">ok</text><circle class="B" cx="260" cy="150" r="7" /><text class="s" x="260" y="176" text-anchor="middle">soft</text><circle class="R" cx="440" cy="150" r="7" /><text class="s" x="440" y="176" text-anchor="middle">hard</text><rect class="f1" x="40" y="136" width="220" height="28"/><rect class="f2" x="260" y="136" width="180" height="28"/><rect x="440" y="136" width="180" height="28" fill="#dc2626" fill-opacity=".15"/><circle class="A" cy="150" r="8"><animate attributeName="cx" values="60;600;60" dur="8s" repeatCount="indefinite"/></circle><text class="s" x="150" y="128" text-anchor="middle">ok</text><text class="s" x="350" y="128" text-anchor="middle">warn: over soft</text><text class="s" x="530" y="128" text-anchor="middle">refuse: over hard</text><text class="m" x="40" y="70" text-anchor="start">estimate before allocation: n·Πrange, n·|det P|, Π round(L/spacing) ≥ 8</text><text class="s" x="40" y="214" text-anchor="start">Standard: drawn 100k / 400k, supercell 50k / 200k, grid 1.5M / 4M, phonons 2k / 8k, Hessian 100 / 300</text><text class="s" x="40" y="236" text-anchor="start">Generous ×2; WarnOnly keeps the soft limit and never refuses. Verdict { level, estimate, sentence }.</text></svg>