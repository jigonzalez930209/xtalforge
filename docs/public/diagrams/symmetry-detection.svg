<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Symmetry detection with the moyo backend"><title>Symmetry detection with the moyo backend</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="759" height="249" rx="10"/><text class="t" x="18" y="26">Symmetry detection with the moyo backend</text><rect class="f1 ln" x="20" y="90" width="126" height="60" rx="8"/><text class="s" x="83.0" y="115.0" text-anchor="middle">Structure</text><text class="s" x="83.0" y="133.0" text-anchor="middle">→ moyo cell</text><line class="bl" x1="146" y1="120.0" x2="166" y2="120.0" /><rect class="f1 ln" x="166" y="90" width="126" height="60" rx="8"/><text class="s" x="229.0" y="115.0" text-anchor="middle">MoyoDataset</text><text class="s" x="229.0" y="133.0" text-anchor="middle">symprec, setting</text><line class="bl" x1="292" y1="120.0" x2="312" y2="120.0" /><rect class="f1 ln" x="312" y="90" width="126" height="60" rx="8"/><text class="s" x="375.0" y="115.0" text-anchor="middle">operations</text><text class="s" x="375.0" y="133.0" text-anchor="middle">SymOp (R, t)</text><line class="bl" x1="438" y1="120.0" x2="458" y2="120.0" /><rect class="f1 ln" x="458" y="90" width="126" height="60" rx="8"/><text class="s" x="521.0" y="115.0" text-anchor="middle">Wyckoff,</text><text class="s" x="521.0" y="133.0" text-anchor="middle">orbits</text><line class="bl" x1="584" y1="120.0" x2="604" y2="120.0" /><rect class="f1 ln" x="604" y="90" width="126" height="60" rx="8"/><text class="s" x="667.0" y="115.0" text-anchor="middle">standard /</text><text class="s" x="667.0" y="133.0" text-anchor="middle">primitive cell</text><circle class="B" cy="120.0" r="6"><animate attributeName="cx" values="28;722" dur="6s" repeatCount="indefinite"/></circle><text class="s" x="20" y="184" text-anchor="start">Atom types (Z, occupancy to 3 decimals) are stricter than spglib's; Setting::Spglib is the default.</text><text class="s" x="20" y="206" text-anchor="start">Fm-3m has 192 operations in the conventional cell (centering expanded). Impose: average the orbit, merge &lt; 1e-5 Å.</text></svg>