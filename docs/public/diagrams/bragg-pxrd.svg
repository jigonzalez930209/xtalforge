<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Bragg's law and the calculated pattern"><title>Bragg's law and the calculated pattern</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="759" height="259" rx="10"/><text class="t" x="18" y="26">Bragg's law and the calculated pattern</text><line class="ln" x1="60" y1="140" x2="340" y2="140" /><circle class="A" cx="75" cy="140" r="5" /><circle class="A" cx="125" cy="140" r="5" /><circle class="A" cx="175" cy="140" r="5" /><circle class="A" cx="225" cy="140" r="5" /><circle class="A" cx="275" cy="140" r="5" /><circle class="A" cx="325" cy="140" r="5" /><line class="ln" x1="60" y1="190" x2="340" y2="190" /><circle class="A" cx="75" cy="190" r="5" /><circle class="A" cx="125" cy="190" r="5" /><circle class="A" cx="175" cy="190" r="5" /><circle class="A" cx="225" cy="190" r="5" /><circle class="A" cx="275" cy="190" r="5" /><circle class="A" cx="325" cy="190" r="5" /><line class="ln" x1="60" y1="240" x2="340" y2="240" /><circle class="A" cx="75" cy="240" r="5" /><circle class="A" cx="125" cy="240" r="5" /><circle class="A" cx="175" cy="240" r="5" /><circle class="A" cx="225" cy="240" r="5" /><circle class="A" cx="275" cy="240" r="5" /><circle class="A" cx="325" cy="240" r="5" /><path class="bl" d="M 90 60 L 175 140 L 260 60" stroke-dasharray="260" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;.4;.85;1" dur="5s" repeatCount="indefinite"/></path><path class="am" d="M 40 60 L 178 190 L 316 60" fill="none" stroke-dasharray="420" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="420;0;0;420" keyTimes="0;.55;.85;1" dur="5s" repeatCount="indefinite"/></path><line class="gr" x1="350" y1="140" x2="350" y2="190" /><text class="m" x="358" y="170" text-anchor="start">d</text><text class="m" x="120" y="118" text-anchor="start">θ</text><text class="m" x="420" y="70" text-anchor="start">2 d sin θ = λ</text><text class="m" x="420" y="96" text-anchor="start">2θ = 2 asin( λ / 2d )</text><text class="m" x="420" y="130" text-anchor="start">I(hkl) = |F(hkl)|² · mult · LP(2θ)</text><text class="s" x="420" y="160" text-anchor="start">Profile: Σ I(hkl) · G(2θ − 2θhkl; FWHM), Gaussian, unit area</text><text class="s" x="420" y="184" text-anchor="start">F: site positions, occupancies, f(s), exp(−8π²U s²)</text><text class="s" x="420" y="214" text-anchor="start">Normalised to 100; raw I in Pattern::reflections</text></svg>