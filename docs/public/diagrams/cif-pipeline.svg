<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="CIF reader pipeline"><title>CIF reader pipeline</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="639" height="229" rx="10"/><text class="t" x="18" y="26">CIF reader pipeline</text><rect class="f1 ln" x="20" y="90" width="108" height="60" rx="8"/><text class="s" x="74.0" y="115.0" text-anchor="middle">decode_text</text><text class="s" x="74.0" y="133.0" text-anchor="middle">UTF-8 / Latin-1</text><line class="bl" x1="128" y1="120.0" x2="144" y2="120.0" /><rect class="f1 ln" x="144" y="90" width="108" height="60" rx="8"/><text class="s" x="198.0" y="115.0" text-anchor="middle">tokenize</text><text class="s" x="198.0" y="133.0" text-anchor="middle">quotes, ;-blocks</text><line class="bl" x1="252" y1="120.0" x2="268" y2="120.0" /><rect class="f1 ln" x="268" y="90" width="108" height="60" rx="8"/><text class="s" x="322.0" y="115.0" text-anchor="middle">parse</text><text class="s" x="322.0" y="133.0" text-anchor="middle">blocks, loops</text><line class="bl" x1="376" y1="120.0" x2="392" y2="120.0" /><rect class="f1 ln" x="392" y="90" width="108" height="60" rx="8"/><text class="s" x="446.0" y="115.0" text-anchor="middle">structure_</text><text class="s" x="446.0" y="133.0" text-anchor="middle">from_block</text><line class="bl" x1="500" y1="120.0" x2="516" y2="120.0" /><rect class="f1 ln" x="516" y="90" width="108" height="60" rx="8"/><text class="s" x="570.0" y="115.0" text-anchor="middle">symmetry</text><text class="s" x="570.0" y="133.0" text-anchor="middle">priority</text><circle class="B" cy="120.0" r="6"><animate attributeName="cx" values="28;616" dur="6s" repeatCount="indefinite"/></circle><text class="s" x="20" y="184" text-anchor="start">Loop values must be a multiple of the tag count; 1.234(5) → 1.234; ? and . are missing.</text><text class="s" x="20" y="206" text-anchor="start">Symmetry: operation loop → Hall / H-M symbol → identity + symmetry_warning.</text></svg>