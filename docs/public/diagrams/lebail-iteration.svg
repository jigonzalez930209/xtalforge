<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" role="img" aria-label="Le Bail intensity partition"><title>Le Bail intensity partition</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="699" height="229" rx="10"/><text class="t" x="18" y="26">Le Bail intensity partition</text><line class="ln" x1="40" y1="170" x2="320" y2="170" /><line class="ln" x1="40" y1="170" x2="320" y2="170" /><line class="ln" x1="40" y1="170" x2="320" y2="170" /><path class="ln" d="M 40 170 C 90 170 90 80 130 80 C 170 80 170 170 220 170 C 250 170 250 120 275 120 C 300 120 300 170 320 170" fill="none"/><path class="bl" d="M 40 170 C 90 170 90 110 130 110 C 170 110 170 170 220 170 C 250 170 250 150 275 150 C 300 150 300 170 320 170" fill="none"><animate attributeName="d" values="M 40 170 C 90 170 90 110 130 110 C 170 110 170 170 220 170 C 250 170 250 150 275 150 C 300 150 300 170 320 170;M 40 170 C 90 170 90 85 130 85 C 170 85 170 170 220 170 C 250 170 250 125 275 125 C 300 125 300 170 320 170;M 40 170 C 90 170 90 80 130 80 C 170 80 170 170 220 170 C 250 170 250 120 275 120 C 300 120 300 170 320 170" dur="5s" repeatCount="indefinite"/></path><text class="m" x="330" y="70" text-anchor="start">y_calc(x) = Σ_k I_k P(x; 2θ_k, w)</text><text class="m" x="330" y="100" text-anchor="start">I_k ← I_k · Σ_win y_obs / Σ_win y_calc</text><text class="s" x="330" y="130" text-anchor="start">window = window · FWHM around each line</text><text class="s" x="330" y="152" text-anchor="start">no calculated intensity in the window → keep I_k</text><text class="s" x="330" y="184" text-anchor="start">Rwp = √(Σw(y−y_c)² / Σw y²),  w = 1/max(y,1)</text><text class="s" x="330" y="206" text-anchor="start">esds from (AᵀWA)⁻¹ · χ²_red; > 128 lines: diagonal only</text><text class="s" x="40" y="200" text-anchor="start">grey: observed   blue: calculated, converging</text></svg>