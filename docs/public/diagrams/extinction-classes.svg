<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Extinction classes"><title>Extinction classes</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="799" height="239" rx="10"/><text class="t" x="18" y="26">Extinction classes</text><rect class="f1 ln" x="40" y="80" width="170" height="130" rx="10"/><text class="s" x="125" y="100" text-anchor="middle">same reflection-</text><text class="s" x="125" y="116" text-anchor="middle">condition signature</text><circle class="B" cx="70" cy="150" r="9" /><text class="s" x="70" y="178" text-anchor="middle">rep.</text><circle class="A" cx="110" cy="150" r="9" /><text class="s" x="110" y="178" text-anchor="middle">G₂</text><circle class="A" cx="150" cy="150" r="9" /><text class="s" x="150" y="178" text-anchor="middle">G₃</text><text class="s" x="125" y="200" text-anchor="middle">= one class</text><rect class="ln" x="250" y="80" width="130" height="130" rx="10" fill="none"/><circle class="R" cx="315" cy="150" r="9" /><text class="s" x="315" y="178" text-anchor="middle">refuted</text><text class="s" x="315" y="200" text-anchor="middle">line absent</text><line class="am" x1="125" y1="150" x2="125" y2="150"/><circle class="am" cx="85" cy="150" r="14" fill="none"><animate attributeName="r" values="12;18;12" dur="3s" repeatCount="indefinite"/></circle><text class="m" x="410" y="92" text-anchor="start">F(hkl) = Σ_ops exp(2πi h·(R r + t))</text><text class="s" x="410" y="118" text-anchor="start">zero for every r ⇒ systematic absence</text><text class="s" x="410" y="148" text-anchor="start">Representative: most operations (rutile → P 4₂/m n m)</text><text class="s" x="410" y="174" text-anchor="start">Rank: Le Bail BIC = n ln(RSS/n) + k ln n</text><text class="s" x="410" y="200" text-anchor="start">Top classes: Pawley Rwp, 1 % tie rule</text></svg>