<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Bond perception by covalent radii"><title>Bond perception by covalent radii</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="639" height="249" rx="10"/><text class="t" x="18" y="26">Bond perception by covalent radii</text><text class="m" x="40" y="50" text-anchor="start">bond iff 0.4 Å ≤ d ≤ 1.15 (rᵢ + rⱼ)</text><circle class="A" cx="150" cy="150" r="36" /><text class="t" x="150" y="155" text-anchor="middle">i</text><circle class="bl dash" cx="150" cy="150" r="74" fill="none"/><line class="gr" x1="150" y1="150" y2="150" x2="215"><animate attributeName="x2" values="290;215;215;290" keyTimes="0;.4;.7;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.38;.4;.7;.72;1" dur="6s" repeatCount="indefinite"/></line><circle class="B" cy="150" r="28" cx="215"><animate attributeName="cx" values="290;215;215;290" keyTimes="0;.4;.7;1" dur="6s" repeatCount="indefinite"/></circle><text class="s" x="150" y="242" text-anchor="middle">cutoff = 1.15 (rᵢ + rⱼ) between centres</text><text class="s" x="400" y="110" text-anchor="start">bonded  → d in range</text><circle class="C" cx="390" cy="106" r="5" /><text class="s" x="400" y="132" text-anchor="start">too far → d &gt; 1.15 (rᵢ+rⱼ)</text><circle class="G" cx="390" cy="128" r="5" /><text class="s" x="400" y="154" text-anchor="start">overlap → d &lt; 0.4 Å (rejected)</text><circle class="R" cx="390" cy="150" r="5" /><text class="s" x="400" y="190" text-anchor="start">Never bonded: dummy X, metal–metal</text><text class="s" x="400" y="210" text-anchor="start">Candidates: neighbours ≤ 2 · max(r) · 1.15</text></svg>