<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="MOF assembly: nodes, linkers and scale"><title>MOF assembly: nodes, linkers and scale</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="699" height="249" rx="10"/><text class="t" x="18" y="26">MOF assembly: nodes, linkers and scale</text><circle class="B" cx="80" cy="150" r="22"/><circle class="B" cx="260" cy="150" r="22"/><rect class="A" x="130" y="140" width="60" height="20" rx="8"><animate attributeName="width" values="30;60;30" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="145;130;145" dur="4s" repeatCount="indefinite"/></rect><line class="ln" x1="102" y1="150" x2="130" y2="150" /><line class="ln" x1="190" y1="150" x2="238" y2="150" /><text class="s" x="80" y="196" text-anchor="middle">node</text><text class="s" x="260" y="196" text-anchor="middle">node</text><text class="s" x="160" y="196" text-anchor="middle">linker</text><text class="m" x="170" y="110" text-anchor="middle">scale = |p_j − p_i| / linker span</text><text class="s" x="340" y="80" text-anchor="start">1. Node at every vertex, oriented</text><text class="s" x="340" y="100" text-anchor="start">   mean connection → mean edge direction</text><text class="s" x="340" y="128" text-anchor="start">2. Greedy match: largest cosine first</text><text class="s" x="340" y="156" text-anchor="start">3. Linker pair (a, b) aligned to p_j − p_i</text><text class="s" x="340" y="184" text-anchor="start">4. Scale clamped to range; out of range = error</text><text class="s" x="340" y="212" text-anchor="start">Output: P1, unrelaxed, topology bonds kept</text></svg>