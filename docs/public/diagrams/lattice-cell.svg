<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Lattice: rows, fractional and Cartesian"><title>Lattice: rows, fractional and Cartesian</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="639" height="259" rx="10"/><text class="t" x="18" y="26">Lattice: rows, fractional and Cartesian</text><polygon class="f1 ln" points="60,230 210,230 270,140 120,140"/><line class="bl" x1="60" y1="230" x2="210" y2="230" /><line class="gr" x1="60" y1="230" x2="120" y2="140" /><text class="s" x="218" y="234" text-anchor="start">a (row 1 of M)</text><text class="s" x="112" y="134" text-anchor="end">b (row 2)</text><path class="ln" d="M 88 230 A 28 28 0 0 0 76 207"/><text class="s" x="94" y="222" text-anchor="start">γ</text><line class="bl" x1="60" y1="230" x2="150.0" y2="230.0" stroke-dasharray="4 3"/><line class="gr" x1="150.0" y1="230.0" x2="180.0" y2="185.0" stroke-dasharray="4 3"/><line class="am" x1="60" y1="230" x2="180.0" y2="185.0" stroke-dasharray="200" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;.35;.85;1" dur="5s" repeatCount="indefinite"/></line><circle class="B" cx="180.0" cy="185.0" r="8" /><text class="m" x="192.0" y="175.0" text-anchor="start">x</text><text class="s" x="370" y="70" text-anchor="start">Rows of M are the vectors a, b, c (Å).</text><text class="m" x="370" y="92" text-anchor="start">x_cart = x_frac M      x_frac = x_cart M⁻¹</text><text class="s" x="370" y="114" text-anchor="start">Reciprocal: M⁻ᵀ (no 2π), a·a* = 1</text><text class="m" x="370" y="136" text-anchor="start">d(hkl) = 1 / |hkl M⁻ᵀ|</text><text class="s" x="370" y="158" text-anchor="start">Metric tensor G = M Mᵀ</text><text class="m" x="370" y="180" text-anchor="start">V = |det M|</text><text class="s" x="370" y="214" text-anchor="start">Standard orientation:</text><text class="s" x="370" y="232" text-anchor="start">a ∥ +x,  b in the xy plane</text></svg>