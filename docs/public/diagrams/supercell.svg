<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Supercell: P·M and image enumeration"><title>Supercell: P·M and image enumeration</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="719" height="269" rx="10"/><text class="t" x="18" y="26">Supercell: P·M and image enumeration</text><rect class="f1 ln" x="40" y="70" width="80" height="80" /><circle class="A" cx="60" cy="90" r="7" /><circle class="B" cx="100" cy="110" r="7" /><text class="s" x="80" y="176" text-anchor="middle">unit cell M</text><text class="t" x="150" y="120" text-anchor="start">→</text><rect class="ln" x="190" y="70" width="80" height="80" fill="none"/><g opacity="0"><circle class="A" cx="210" cy="90" r="7"/><circle class="B" cx="250" cy="110" r="7"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;.9;1" dur="6s" repeatCount="indefinite"/></g><rect class="ln" x="190" y="150" width="80" height="80" fill="none"/><g opacity="0"><circle class="A" cx="210" cy="170" r="7"/><circle class="B" cx="250" cy="190" r="7"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;.9;1" dur="6s" repeatCount="indefinite"/></g><rect class="ln" x="270" y="70" width="80" height="80" fill="none"/><g opacity="0"><circle class="A" cx="290" cy="90" r="7"/><circle class="B" cx="330" cy="110" r="7"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.4;.9;1" dur="6s" repeatCount="indefinite"/></g><rect class="ln" x="270" y="150" width="80" height="80" fill="none"/><g opacity="0"><circle class="A" cx="290" cy="170" r="7"/><circle class="B" cx="330" cy="190" r="7"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5499999999999999;.9;1" dur="6s" repeatCount="indefinite"/></g><rect class="bl" x="190" y="70" width="160" height="160" fill="none"/><text class="s" x="270" y="248" text-anchor="middle">new lattice P·M</text><text class="m" x="380" y="90" text-anchor="start">M′ = P M    (P integer, |det P| > 0)</text><text class="m" x="380" y="120" text-anchor="start">x′ = (x + n) P⁻¹</text><text class="s" x="380" y="150" text-anchor="start">n runs over a box of size 4‖P⁻¹‖max + 2</text><text class="s" x="380" y="172" text-anchor="start">keep images in [0, 1); drop boundary duplicates</text><text class="s" x="380" y="194" text-anchor="start">atoms = n_sites · |det P|  (result is P1)</text></svg>