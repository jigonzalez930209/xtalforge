</text><text class="s" x="480.0" y="138.0" text-anchor="middle">compare</text><line class="bl" x1="538" y1="125.0" x2="556" y2="125.0" /><rect class="f1 ln" x="556" y="90" width="116" height="70" rx="8"/><text class="s" x="614.0" y="120.0" text-anchor="middle">tolerance</text><text class="s" x="614.0" y="138.0" text-anchor="middle">in the page</text><circle class="B" cy="125.0" r="6"><animate attributeName="cx" values="28;664" dur="6s" repeatCount="indefinite"/></circle><text class="s" x="20" y="194" text-anchor="start">Exact for sets and counts; 1e-6 … 5e-4 for numbers; wider tolerances need a changelog note.</text><text class="s" x="20" y="216" text-anchor="start">External sets: CoRE MOF, tmQM, QMOF, RCSR, EQeq (MOF-5), sci-form UFF.</text></svg>