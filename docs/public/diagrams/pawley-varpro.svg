<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Pawley: variable projection"><title>Pawley: variable projection</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="719" height="249" rx="10"/><text class="t" x="18" y="26">Pawley: variable projection</text><rect class="f1 ln" x="20" y="90" width="118" height="60" rx="8"/><text class="s" x="79.0" y="115.0" text-anchor="middle">cell, zero,</text><text class="s" x="79.0" y="133.0" text-anchor="middle">size, strain</text><line class="bl" x1="138" y1="120.0" x2="156" y2="120.0" /><rect class="f1 ln" x="156" y="90" width="118" height="60" rx="8"/><text class="s" x="215.0" y="115.0" text-anchor="middle">reflections</text><text class="s" x="215.0" y="133.0" text-anchor="middle">2θ_k from cell</text><line class="bl" x1="274" y1="120.0" x2="292" y2="120.0" /><rect class="f1 ln" x="292" y="90" width="118" height="60" rx="8"/><text class="s" x="351.0" y="115.0" text-anchor="middle">solve linear</text><text class="s" x="351.0" y="133.0" text-anchor="middle">I_k and c_j</text><line class="bl" x1="410" y1="120.0" x2="428" y2="120.0" /><rect class="f1 ln" x="428" y="90" width="118" height="60" rx="8"/><text class="s" x="487.0" y="115.0" text-anchor="middle">Rwp(θ)</text><text class="s" x="487.0" y="133.0" text-anchor="middle">objective</text><line class="bl" x1="546" y1="120.0" x2="564" y2="120.0" /><rect class="f1 ln" x="564" y="90" width="118" height="60" rx="8"/><text class="s" x="623.0" y="115.0" text-anchor="middle">Nelder-Mead</text><text class="s" x="623.0" y="133.0" text-anchor="middle">step</text><circle class="B" cy="120.0" r="6"><animate attributeName="cx" values="28;674" dur="6s" repeatCount="indefinite"/></circle><text class="s" x="20" y="184" text-anchor="start">Linear part: one weighted solve for all intensities and the Chebyshev background.</text><text class="s" x="20" y="206" text-anchor="start">w(θ)² = size² + (strain · tanθ)²; the non-linear vector is refined, the linear part re-solved at every evaluation.</text></svg>