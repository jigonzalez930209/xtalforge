<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Periodic neighbour search: linked cells"><title>Periodic neighbour search: linked cells</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="639" height="339" rx="10"/><text class="t" x="18" y="26">Periodic neighbour search: linked cells</text><rect class="ln" x="40" y="50" width="52" height="52" fill="none"/><rect class="ln" x="40" y="102" width="52" height="52" fill="none"/><rect class="ln" x="40" y="154" width="52" height="52" fill="none"/><rect class="ln" x="40" y="206" width="52" height="52" fill="none"/><rect class="ln" x="40" y="258" width="52" height="52" fill="none"/><rect class="ln" x="92" y="50" width="52" height="52" fill="none"/><rect class="ln" x="92" y="102" width="52" height="52" fill="none"/><rect class="ln" x="92" y="154" width="52" height="52" fill="none"/><rect class="ln" x="92" y="206" width="52" height="52" fill="none"/><rect class="ln" x="92" y="258" width="52" height="52" fill="none"/><rect class="ln" x="144" y="50" width="52" height="52" fill="none"/><rect class="ln" x="144" y="102" width="52" height="52" fill="none"/><rect class="ln" x="144" y="154" width="52" height="52" fill="none"/><rect class="ln" x="144" y="206" width="52" height="52" fill="none"/><rect class="ln" x="144" y="258" width="52" height="52" fill="none"/><rect class="ln" x="196" y="50" width="52" height="52" fill="none"/><rect class="ln" x="196" y="102" width="52" height="52" fill="none"/><rect class="ln" x="196" y="154" width="52" height="52" fill="none"/><rect class="ln" x="196" y="206" width="52" height="52" fill="none"/><rect class="ln" x="196" y="258" width="52" height="52" fill="none"/><rect class="ln" x="248" y="50" width="52" height="52" fill="none"/><rect class="ln" x="248" y="102" width="52" height="52" fill="none"/><rect class="ln" x="248" y="154" width="52" height="52" fill="none"/><rect class="ln" x="248" y="206" width="52" height="52" fill="none"/><rect class="ln" x="248" y="258" width="52" height="52" fill="none"/><rect class="f2" x="92" y="102" width="156" height="156"><animate attributeName="fill-opacity" values=".08;.3;.08" dur="3s" repeatCount="indefinite"/></rect><circle class="bl dash" cx="162.0" cy="186.0" r="46.800000000000004" fill="none"/><circle class="R" cx="162.0" cy="186.0" r="6" /><circle class="A" cx="192.0" cy="162.0" r="6" /><circle class="A" cx="128.0" cy="206.0" r="6" /><circle class="G" cx="232.0" cy="246.0" r="6" /><circle class="G" cx="60" cy="75" r="6" /><circle class="G" cx="82.0" cy="126.0" r="6" /><text class="s" x="40" y="332" text-anchor="start">bin width ≥ cutoff / d_k  →  only the 3×3×3 neighbouring bins can hold a contact</text><text class="s" x="330" y="70" text-anchor="start">1. Expand to P1</text><text class="s" x="330" y="92" text-anchor="start">2. d_k = 1 / |k*|  (perpendicular width)</text><text class="s" x="330" y="114" text-anchor="start">3. n_k = max(1, ⌊d_k / cutoff⌋) bins per axis</text><text class="s" x="330" y="136" text-anchor="start">4. Insert each atom in one bin</text><text class="s" x="330" y="158" text-anchor="start">5. Test the 27 adjacent bins (wrapped)</text><text class="s" x="330" y="180" text-anchor="start">6. Enumerate images, filter by exact |r| ≤ cutoff</text><text class="m" x="330" y="212" text-anchor="start">Result sorted by (i, j, image, distance)</text></svg>