<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="P1 expansion with provenance"><title>P1 expansion with provenance</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="719" height="279" rx="10"/><text class="t" x="18" y="26">P1 expansion with provenance</text><text class="m" x="40" y="64" text-anchor="start">base = Rₒ xₛ + tₒ     frac = base − ⌊base⌋     τ = −⌊base⌋</text><rect class="f1 ln" x="40" y="90" width="150" height="150"/><circle class="A" cx="80" cy="130" r="7" /><text class="s" x="115" y="208" text-anchor="middle">asymmetric site xₛ</text><text class="t" x="215" y="170" text-anchor="start">→</text><rect class="ln" x="250" y="90" width="150" height="150" fill="none"/><g opacity="0"><circle class="A" cx="280" cy="130" r="7" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;.92;1" dur="6s" repeatCount="indefinite"/></g><g opacity="0"><circle class="B" cx="370" cy="130" r="7" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.28;.92;1" dur="6s" repeatCount="indefinite"/></g><g opacity="0"><circle class="B" cx="280" cy="210" r="7" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.45999999999999996;.92;1" dur="6s" repeatCount="indefinite"/></g><g opacity="0"><circle class="A" cx="370" cy="210" r="7" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.64;.92;1" dur="6s" repeatCount="indefinite"/></g><text class="s" x="325" y="258" text-anchor="middle">one image per operation</text><text class="s" x="430" y="110" text-anchor="start">Duplicates (special positions):</text><text class="s" x="430" y="132" text-anchor="start">periodic distance ≤ 0.05 Å → dropped</text><text class="s" x="430" y="160" text-anchor="start">Grid reset per site →</text><text class="s" x="430" y="180" text-anchor="start">disorder components both survive</text><text class="s" x="430" y="210" text-anchor="start">Stored atom: frac = o(xₛ) + τ,  τ ∈ ℤ³</text><text class="s" x="430" y="230" text-anchor="start">count = Wyckoff multiplicity</text></svg>