" /><circle class="B" cx="160" cy="131" r="8" /><circle class="B" cx="200" cy="131" r="8" /><circle class="B" cx="240" cy="131" r="8" /><circle class="B" cx="280" cy="131" r="8" /><circle class="B" cx="320" cy="131" r="8" /><line class="rd" x1="30" y1="52" x2="330" y2="52" stroke-dasharray="6 4"/><rect class="f2" x="40" y="52" width="300" height="46"><animate attributeName="height" values="46;60;46" dur="4s" repeatCount="indefinite"/></rect><text class="s" x="190" y="80" text-anchor="middle">vacuum</text><line class="gr" x1="350" y1="52" x2="350" y2="142" /><text class="s" x="358" y="102" text-anchor="start">layers × |rise|</text><text class="s" x="40" y="254" text-anchor="start">surface_basis(hkl): Euclid on (h,k,l) → unimodular, right-handed</text><text class="s" x="40" y="272" text-anchor="start">rows 1–2 lie in (hkl); row 3 satisfies h · v₃ = 1</text><text class="m" x="40" y="296" text-anchor="start">c_slab = normal · sign(rise) · height,   height = layers·|rise| + vacuum</text><text class="s" x="40" y="318" text-anchor="start">SLAB_FLOOR keeps atoms off the cell face; Slab.cut = 0 (no bond carrying yet)</text></svg>