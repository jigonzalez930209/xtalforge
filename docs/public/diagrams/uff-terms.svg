<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="UFF energy terms"><title>UFF energy terms</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="679" height="299" rx="10"/><text class="t" x="18" y="26">UFF energy terms</text><circle class="A" cx="70" cy="110" r="10"/><circle class="A" cx="150" cy="110" r="10"/><line class="bl" x1="70" y1="110" x2="150" y2="110" /><text class="s" x="110" y="150" text-anchor="middle">bond</text><text class="m" x="110" y="170" text-anchor="middle">½ k (r−r₀)²</text><text class="s" x="110" y="190" text-anchor="middle">k = 664.12 Z₁Z₂ / r₀³</text><circle class="A" cx="250" cy="130" r="10"/><circle class="A" cx="310" cy="80" r="10"/><circle class="A" cx="370" cy="130" r="10"/><line class="gr" x1="250" y1="130" x2="310" y2="80" /><line class="gr" x1="310" y1="80" x2="370" y2="130" /><path class="am" d="M 295 98 A 22 22 0 0 0 325 98"/><text class="s" x="310" y="150" text-anchor="middle">angle</text><text class="m" x="310" y="170" text-anchor="middle">cosine expansion, K_IJK</text><circle class="B" cx="470" cy="80" r="10"/><circle class="B" cx="540" cy="120" r="10"/><line class="am" x1="470" y1="80" x2="540" y2="120" /><circle class="B" cx="600" cy="80" r="10"><animate attributeName="cy" values="80;130;80" dur="4s" repeatCount="indefinite"/></circle>