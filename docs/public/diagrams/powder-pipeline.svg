<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-label="Automatic powder run"><title>Automatic powder run</title><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.t{font:600 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#475569}.m{font:italic 13px Georgia,serif;fill:#0f172a}.ln{stroke:#94a3b8;stroke-width:1.5;fill:none}.bl{stroke:#2563eb;stroke-width:2.5;fill:none}.am{stroke:#f59e0b;stroke-width:2.5;fill:none}.gr{stroke:#16a34a;stroke-width:2.5;fill:none}.rd{stroke:#dc2626;stroke-width:2.5;fill:none}.dash{stroke-dasharray:5 4}.A{fill:#2563eb}.B{fill:#f59e0b}.C{fill:#16a34a}.R{fill:#dc2626}.G{fill:#cbd5e1}.f1{fill:#2563eb;fill-opacity:.12}.f2{fill:#f59e0b;fill-opacity:.2}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style></style><rect class="bg" x=".5" y=".5" width="659" height="239" rx="10"/><text class="t" x="18" y="26">Automatic powder run</text><rect class="f1 ln" x="24" y="90" width="92" height="60" rx="8"/><text class="s" x="70" y="116" text-anchor="middle">Peaks +</text><text class="s" x="70" y="134" text-anchor="middle">background</text><line class="bl" x1="116" y1="120" x2="128" y2="120" /><rect class="f1 ln" x="128" y="90" width="92" height="60" rx="8"/><text class="s" x="174" y="116" text-anchor="middle">Index</text><text class="s" x="174" y="134" text-anchor="middle">(M20, F_N)</text><line class="bl" x1="220" y1="120" x2="232" y2="120" /><rect class="f1 ln" x="232" y="90" width="92" height="60" rx="8"/><text class="s" x="278" y="116" text-anchor="middle">Extinction</text><text class="s" x="278" y="134" text-anchor="middle">classes</text><line class="bl" x1="324" y1="120" x2="336" y2="120" /><rect class="f1 ln" x="336" y="90" width="92" height="60" rx="8"/><text class="s" x="382" y="116" text-anchor="middle">Le Bail</text><text class="s" x="382" y="134" text-anchor="middle">BIC</text><line class="bl" x1="428" y1="120" x2="440" y2="120" /><rect class="f1 ln" x="440" y="90" width="92" height="60" rx="8"/><text class="s" x="486" y="116" text-anchor="middle">Pawley</text><text class="s" x="486" y="134" text-anchor="middle">Rwp</text><line class="bl" x1="532" y1="120" x2="544" y2="120" /><rect class="f1 ln" x="544" y="90" width="92" height="60" rx="8"/><text class="s" x="590" y="116" text-anchor="middle">Rietveld</text><text class="s" x="590" y="134" text-anchor="middle">(optional)</text><circle class="B" cy="120" r="6"><animate attributeName="cx" values="30;610" dur="6s" repeatCount="indefinite"/></circle><text class="s" x="24" y="190" text-anchor="start">Deterministic: no random restarts; every ranking has a documented tie-break (1 % Rwp rule).</text><text class="s" x="24" y="212" text-anchor="start">Output: leading-cell table, per-class evidence, accepted phase, rejection diagnostics.</text></svg>