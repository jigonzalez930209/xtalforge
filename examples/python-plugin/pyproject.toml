[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtalforge-demo-plugin"
version = "0.1.0"
description = "Template Python plugin for xtalforge."
requires-python = ">=3.9"
dependencies = ["xtalforge>=1.6"]

[project.entry-points."xtalforge.plugins"]
demo = "xtalforge_demo_plugin:register"
