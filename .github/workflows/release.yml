name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Version lockstep
        run: scripts/sync-version.sh --check
      - name: Agent memory version
        run: scripts/check-agent-version.sh
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match workspace version v${version}" >&2
            exit 1
          }
      - name: Changelog has the release section
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  cli-linux:
    name: CLI Linux packages
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release-linux
          cache-on-failure: true
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: cargo-package-tools-linux-v2
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
      - name: Build the binary
        run: cargo build --release -p xtalforge-cli --locked
      - name: Package deb and rpm
        run: |
          mkdir -p artifacts
          cargo deb -p xtalforge-cli --no-build --no-dbgsym --output artifacts
          (cd crates/xtalforge-cli && cargo generate-rpm --output ../../artifacts --payload-compress gzip)
      - name: Package tar.gz and AppImage
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p package artifacts
          cp target/release/xtalforge package/
          cp README.md LICENSE-MIT LICENSE-APACHE package/
          tar -czf "artifacts/xtalforge-${version}-linux-x86_64.tar.gz" -C package .
          scripts/package-appimage.sh artifacts
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net assets/io.github.jigonzalez930209.xtalforge.appdata.xml
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: artifacts/*
          if-no-files-found: error

  cli-windows:
    name: CLI Windows archive
    needs: version
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release-windows
          cache-on-failure: true
      - name: Build the binary
        run: cargo build --release -p xtalforge-cli --locked
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force package, artifacts | Out-Null
          Copy-Item target\release\xtalforge.exe package\
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE package\
          Compress-Archive -Path package\* -DestinationPath "artifacts\xtalforge-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: artifacts/*
          if-no-files-found: error

  cli-macos:
    name: CLI macOS universal
    needs: version
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release-macos-universal
          cache-on-failure: true
      - name: Build both architectures
        run: |
          cargo build --release -p xtalforge-cli --locked --target x86_64-apple-darwin
          cargo build --release -p xtalforge-cli --locked --target aarch64-apple-darwin
      - name: Package tar.gz and dmg
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p package artifacts dmg
          lipo -create \
            "target/x86_64-apple-darwin/release/xtalforge" \
            "target/aarch64-apple-darwin/release/xtalforge" \
            -output package/xtalforge
          cp README.md LICENSE-MIT LICENSE-APACHE package/
          tar -czf "artifacts/xtalforge-${version}-macos-universal.tar.gz" -C package .
          cp package/xtalforge dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "xtalforge" -srcfolder dmg -ov -format UDZO \
            "artifacts/xtalforge-${version}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-macos
          path: artifacts/*
          if-no-files-found: error

  github-release:
    name: Publish the GitHub release
    needs: [cli-linux, cli-windows, cli-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

  publish-packages:
    name: Publish PyPI, npm and crates.io
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-publish
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build the Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist-wheel
          working-directory: crates/xtalforge-python
          manylinux: auto
      - name: Build the Python sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist-sdist
          working-directory: crates/xtalforge-python
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --quiet --upgrade twine
          python -m twine upload \
            --username __token__ \
            --password "${PYPI_API_TOKEN}" \
            --skip-existing \
            crates/xtalforge-python/dist-wheel/* \
            crates/xtalforge-python/dist-sdist/*

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --version 0.13.1 --locked
      - name: Build the npm package
        working-directory: crates/xtalforge-wasm
        run: wasm-pack build --release --target bundler --out-dir pkg-bundler
      - name: Publish to npm
        working-directory: crates/xtalforge-wasm/pkg-bundler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "xtalforge-wasm@${version}" version >/dev/null 2>&1; then
            echo "xtalforge-wasm@${version} is already published"
          else
            npm publish --provenance --access public
          fi
      - name: Build the documentation WASM package
        working-directory: crates/xtalforge-wasm
        run: wasm-pack build --release --target web --out-dir pkg-web
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-web
          path: crates/xtalforge-wasm/pkg-web
          if-no-files-found: error
          retention-days: 1

      - name: Compile the workspace once
        run: cargo build --workspace --all-features --locked
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  docs:
    name: Build and deploy the documentation
    needs: publish-packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wasm-web
          path: crates/xtalforge-wasm/pkg
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install and build
        working-directory: docs
        run: |
          npm ci
          npm run docs:build
      - name: Prepare the link-check root
        run: |
          mkdir -p .linkroot
          ln -sfn "$PWD/docs/.vitepress/dist" .linkroot/xtalforge
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --accept 200,204,206 --root-dir .linkroot --fallback-extensions html ./docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v5
