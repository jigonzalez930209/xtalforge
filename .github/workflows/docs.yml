name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-manual
          cache-on-failure: true
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the WASM demo package
        working-directory: crates/xtalforge-wasm
        run: wasm-pack build --release --target web
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npm run docs:build
      - name: Prepare the link-check root
        run: |
          mkdir -p .linkroot
          ln -sfn "$PWD/docs/.vitepress/dist" .linkroot/xtalforge
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --accept 200,204,206 --root-dir .linkroot --fallback-extensions html ./docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
