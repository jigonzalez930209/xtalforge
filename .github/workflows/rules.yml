name: Rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Repository rules
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check repository rules
        run: scripts/check-rules.sh
      - name: Run the rules self-test
        run: scripts/tests/run-rules-selftest.sh
      - name: Check AGENTS.md version on tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-agent-version.sh

  format-and-lints:
    name: Format and lints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build rustdoc with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
