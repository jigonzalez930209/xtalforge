[package]
name = "xtalforge-mof"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MOF topologies and framework assembly for xtalforge."
include = ["src/**", "data/**"]

[dependencies]
xtalforge-analysis = { workspace = true }
xtalforge-build = { workspace = true }
xtalforge-core = { workspace = true }
xtalforge-ff = { workspace = true }
xtalforge-io = { workspace = true }
xtalforge-symmetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# The full PORMAKE 0.2.3 topology and block bundle (MIT) is loaded lazily
# from the gzip data files under `data/`.
mof-data = ["dep:flate2"]
net = ["dep:ureq"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
