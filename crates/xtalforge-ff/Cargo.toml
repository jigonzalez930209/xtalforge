[package]
name = "xtalforge-ff"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Force fields, charges, optimizers and thermochemistry for xtalforge."
include = ["src/**", "data/**"]

[dependencies]
xtalforge-build = { workspace = true }
xtalforge-core = { workspace = true }
sci-form = { version = "2.0.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
xtalforge-io = { workspace = true }

[features]
default = []
# In-process GFN0/GFN1/GFN2-xTB through the published sci-form crate
# (MIT, Task 4.10).  The methods are molecular only: the adapter refuses a
# structure with space-group symmetry and documents that the P1 cell is
# treated as an isolated cluster.
sci-form = ["dep:sci-form"]

[lints]
workspace = true

[[bench]]
name = "uff"
harness = false

[package.metadata.docs.rs]
all-features = true
