[package]
name = "xtalforge"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure Rust library for building, manipulating, analysing and exporting crystal structures."
include = ["src/**"]

[dependencies]
xtalforge-core = { workspace = true }
xtalforge-engines = { workspace = true, optional = true }
xtalforge-io = { workspace = true }
xtalforge-symmetry = { workspace = true }
xtalforge-view = { workspace = true }
xtalforge-commands = { workspace = true }
xtalforge-agent = { workspace = true, optional = true }
xtalforge-analysis = { workspace = true, optional = true }
xtalforge-build = { workspace = true, optional = true }
xtalforge-ff = { workspace = true, optional = true }
xtalforge-mof = { workspace = true, optional = true }
xtalforge-modules = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["parallel", "full"]
parallel = [
  "xtalforge-core/parallel",
  "xtalforge-io/parallel",
  "xtalforge-ff/parallel",
  "xtalforge-symmetry/parallel",
]
# Surface tiers (Task 15.3.1). The base build always carries core, IO,
# symmetry, view and commands; each feature adds one re-exported crate and
# implies the tiers below it, so `build` implies `analysis`, `ff` implies
# `build` and `mof` implies `ff`. `full` reproduces the 1.7.0 default.
analysis = ["dep:xtalforge-analysis"]
build = ["dep:xtalforge-build", "analysis"]
ff = ["dep:xtalforge-ff", "build"]
mof = ["dep:xtalforge-mof", "ff", "analysis"]
engines = ["dep:xtalforge-engines", "mof"]
modules = ["dep:xtalforge-modules"]
agent = ["dep:xtalforge-agent", "analysis", "build", "ff", "mof", "modules"]
full = ["analysis", "build", "ff", "mof", "engines", "modules", "agent"]
sci-form = ["agent", "xtalforge-ff/sci-form", "xtalforge-agent/sci-form"]
ml = []
external = []
net = ["dep:ureq", "xtalforge-mof?/net"]
mof-data = ["mof", "xtalforge-mof/mof-data"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
