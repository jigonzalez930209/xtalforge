[package]
name = "xtalforge"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure Rust library for building, manipulating, analysing and exporting crystal structures."
include = ["src/**"]

[dependencies]
xtalforge-core = { workspace = true }
xtalforge-io = { workspace = true }
xtalforge-symmetry = { workspace = true }
xtalforge-view = { workspace = true }
xtalforge-agent = { workspace = true }
xtalforge-analysis = { workspace = true }
xtalforge-build = { workspace = true }
xtalforge-commands = { workspace = true }
xtalforge-ff = { workspace = true }
xtalforge-mof = { workspace = true }
xtalforge-modules = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["parallel"]
parallel = [
  "xtalforge-core/parallel",
  "xtalforge-io/parallel",
  "xtalforge-symmetry/parallel",
]
sci-form = ["xtalforge-ff/sci-form", "xtalforge-agent/sci-form"]
ml = []
external = []
mof-data = ["xtalforge-mof/mof-data"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
