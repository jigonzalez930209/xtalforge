[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xtalforge"
description = "Python bindings for the xtalforge crystal-structure library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://jigonzalez930209.github.io/xtalforge/"
Repository = "https://github.com/jigonzalez930209/xtalforge"
Documentation = "https://jigonzalez930209.github.io/xtalforge/api/"
Changelog = "https://github.com/jigonzalez930209/xtalforge/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "xtalforge._xtalforge"
python-source = "python"
features = ["extension-module"]
strip = true
