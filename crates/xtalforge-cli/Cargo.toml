[package]
name = "xtalforge-cli"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface for xtalforge."
include = ["src/**"]

[[bin]]
name = "xtalforge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
xtalforge = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "xtalforge"
maintainer = "Jose Ivan Gonzalez <jigonzalez930209@gmail.com>"
copyright = "2026, Jose Ivan Gonzalez"
section = "science"
priority = "optional"
depends = "$auto"
extended-description = "Command-line interface for building, manipulating, analysing and exporting crystal structures."
assets = [
  ["../../target/release/xtalforge", "usr/bin/", "755"],
  ["../../assets/io.github.jigonzalez930209.xtalforge.desktop", "usr/share/applications/", "644"],
  ["../../assets/xtalforge.png", "usr/share/icons/hicolor/256x256/apps/xtalforge.png", "644"],
  ["../../assets/io.github.jigonzalez930209.xtalforge.appdata.xml", "usr/share/metainfo/io.github.jigonzalez930209.xtalforge.appdata.xml", "644"],
]

[package.metadata.generate-rpm]
name = "xtalforge"
summary = "Command-line interface for xtalforge"
license = "MIT OR Apache-2.0"
assets = [
  { source = "../../target/release/xtalforge", dest = "/usr/bin/xtalforge", mode = "755" },
  { source = "../../assets/io.github.jigonzalez930209.xtalforge.desktop", dest = "/usr/share/applications/io.github.jigonzalez930209.xtalforge.desktop", mode = "644" },
  { source = "../../assets/xtalforge.png", dest = "/usr/share/icons/hicolor/256x256/apps/xtalforge.png", mode = "644" },
  { source = "../../assets/io.github.jigonzalez930209.xtalforge.appdata.xml", dest = "/usr/share/metainfo/io.github.jigonzalez930209.xtalforge.appdata.xml", mode = "644" },
]

[package.metadata.docs.rs]
all-features = true
